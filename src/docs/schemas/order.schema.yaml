components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        userId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        totalPrice:
          type: number
          format: float
          example: 199
        status:
          type: string
          enum: ["pending", "processing", "shipped", "delivered", "cancelled"]
          example: "pending"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-11T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-11-11T12:00:00Z"
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        orderId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        productId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        quantity:
          type: integer
          example: 2
        product:
          $ref: '#/components/schemas/Product'

    OrderProductRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        quantity:
          type: integer
          minimum: 1
          example: 2
        description:
          type: string
          example: "Special instructions for this product"

    OrderCreateRequest:
      type: object
      required:
        - orderData
      properties:
        orderData:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderProductRequest'
          example:
            - productId: "123e4567-e89b-12d3-a456-426614174002"
              quantity: 2
              description: "Blue color preferred"
            - productId: "123e4567-e89b-12d3-a456-426614174003"
              quantity: 1

    OrderCreateResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        totalPrice:
          type: number
          format: float
          example: 190
        status:
          type: string
          example: "pending"
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              price:
                type: number
              quantity:
                type: integer

    OrderListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        totalPrice:
          type: number
          format: float
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        orderItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              quantity:
                type: integer
              product:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  price:
                    type: number

    PaginatedOrders:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
        totalOrders:
          type: integer
          example: 47
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderListResponse'

    ApiResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: object
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          type: string
