components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Electronics"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-11T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-11-11T12:00:00Z"

    CategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Electronics"
